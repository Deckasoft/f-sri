# Production compose file for the Hostinger VPS. Distinct from compose.yml
# (dev-only: mongo + mongo-express with hardcoded weak credentials) — do not
# merge the two. There is NO mongo service here: production data lives in
# MongoDB Atlas, reached via MONGO_URI in .env.production (see
# DEPLOYMENT.md for allowlisting the VPS's IP in Atlas). The container is
# stateless — no PDF volume — because PDF_STORAGE_PROVIDER=s3 is the
# production default (see .env.example); nothing here should reintroduce a
# `local`-storage volume.
#
# First-time setup on the VPS (or after changing the Caddyfile/env):
#   docker compose -f compose.prod.yml pull
#   docker compose -f compose.prod.yml up -d
#
# After that, deploys do NOT touch the VPS: `api`/`worker` track the `:prod`
# tag, and the `watchtower` service below polls GHCR and recreates them when
# that tag's digest changes. To ship a new version, run the "Promote to
# production" GitHub Action (.github/workflows/promote.yml), which retags
# `:latest` -> `:prod` — that retag IS the deploy. `docker compose pull && up
# -d` is still the fallback if Watchtower is down or you need to force it.
#
# The `:latest` tag is built and pushed to GHCR by .github/workflows/ci.yml on
# every push to main (see the `docker` job), which publishes to
# ghcr.io/<owner>/<repo> lowercased (GHCR/Docker registry paths must be all
# lowercase; the workflow lowercases `github.repository` before using it).
# For this repo (github.com/Deckasoft/f-sri) that's ghcr.io/deckasoft/f-sri —
# the default below matches it. GHCR packages default to PRIVATE visibility:
# see DEPLOYMENT.md section 4 for the two ways to make `docker compose pull`
# (and Watchtower) succeed on the VPS (docker login ghcr.io with a PAT, or
# make the package public) — Watchtower reads the same
# ~/.docker/config.json the `docker login` writes, mounted read-only below.

services:
  api:
    image: ${GHCR_IMAGE:-ghcr.io/deckasoft/f-sri:prod}
    restart: always
    env_file:
      - .env.production
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    expose:
      - '3000'
    # No `ports:` mapping — only Caddy is published on the host; the api
    # container is reached over the internal compose network as `api:3000`
    # (see Caddyfile).
    healthcheck:
      # Makes an unreachable MongoDB Atlas (e.g. the VPS's IP not yet
      # allowlisted — the single most likely first-deploy mistake) visible
      # in `docker compose ps`/`docker ps` instead of a container that looks
      # "up" but never actually bound port 3000. src/index.ts calls
      # process.exit(1) if the initial Mongo connection fails, so
      # `restart: always` will keep retrying too — this healthcheck is the
      # other half: making that state observable, not just eventually
      # self-healing. `wget` is already installed in the runtime image (part
      # of Puppeteer's Debian dependency list) so no extra package is added
      # just for this.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Chromium (spawned per PDF generation, see src/utils/pdf.utils.ts) is
    # memory-hungry; without a ceiling, an OOM loop on a small VPS can create
    # host-wide memory pressure that starves Caddy/other services too. 768m
    # is a starting point for a small VPS plan (e.g. Hostinger's 2GB/4GB
    # tiers) — tune per DEPLOYMENT.md section 7 based on actual plan size
    # and observed usage (`docker stats`).
    mem_limit: 768m
    mem_reservation: 256m
    depends_on:
      redis:
        condition: service_healthy

  # Same image as the api, different command. The SRI authorization poll runs
  # here rather than in the web process: it used to be an unref()'d setTimeout
  # inside the api, so a deploy or a crash silently dropped every comprobante
  # still awaiting authorization, with nothing to pick them up again.
  worker:
    image: ${GHCR_IMAGE:-ghcr.io/deckasoft/f-sri:prod}
    restart: always
    command: ['node', 'dist/worker.js']
    env_file:
      - .env.production
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    depends_on:
      redis:
        condition: service_healthy
    # No healthcheck: the worker binds no port. Its liveness shows up as jobs
    # draining; a dead worker leaves comprobantes in PENDIENTE, which the
    # reconciler re-enqueues as soon as one is running again.
    # Same ceiling as the api, and for the same reason: the RIDE is rendered
    # by a headless Chromium, which moved into this process. 512m was not
    # enough -- Chromium died on launch under real job load.
    mem_limit: 768m
    mem_reservation: 256m

  # Job store only. Everything in here is derivable from MongoDB — the
  # reconciler (src/queue/reconciler.ts) re-enqueues anything still awaiting
  # authorization — so this deliberately has NO volume: losing it costs at
  # most one sweep interval, not data.
  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    mem_reservation: 64m

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Polls GHCR for a new digest on the `:prod` tag and recreates any
  # container labeled watchtower.enable=true when it changes — `api` and
  # `worker`, not `redis`/`caddy`. Deploying to production is retagging
  # `:prod` in CI (see .github/workflows/promote.yml), not SSHing in; this
  # is the other half, picking that retag up without a manual `pull && up`.
  # `--cleanup` removes the superseded image afterwards so old layers don't
  # slowly fill the VPS disk.
  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    command: ['--interval', '300', '--cleanup', '--label-enable']
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
